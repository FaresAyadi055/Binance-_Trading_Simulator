<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10141a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Binance Sim</title><link rel="stylesheet" href="style.css"></head><body>
<header>
  <span id="ws" class="dot" title="Live feed"></span>
  <div class="bal"><small>USDT</small><b id="bal">0.00</b></div>
  <button id="add">Add credit</button><button id="rem">Remove credit</button>
</header>
<main>
<section id="trade" class="page on">
  <div class="top"><button id="pick" class="sym">BTC/USDT ▾</button><div><b id="price" class="big">–</b><span id="chg"></span></div></div>
  <canvas id="chart"></canvas>
  <div class="panel">
    <div class="seg"><button data-side="buy" class="on">Buy</button><button data-side="sell">Sell</button></div>
    <label id="amtlbl">Amount (USDT)</label>
    <input id="amt" type="number" inputmode="decimal" min="0" step="any" placeholder="0.00">
    <div class="pct"><button data-p="25">25%</button><button data-p="50">50%</button><button data-p="75">75%</button><button data-p="100">Max</button></div>
    <div id="est" class="est">Enter an amount to see the fill price, slippage and fees.</div>
    <button id="go" class="go">Buy BTC</button>
  </div>
</section>
<section id="assets" class="page"><div id="ast"></div></section>
<section id="history" class="page">
  <div class="bar"><button id="dl">Download JSON</button><button id="imp">Import (overwrite)</button><input id="file" type="file" accept="application/json" hidden></div>
  <div id="hist"></div>
</section>
<section id="analytics" class="page"><div id="cards" class="cards"></div><h3>Holdings</h3><div id="hold"></div>
<div class="hrow"><h3>Missed opportunities</h3><button id="mrf">Refresh</button></div>
<p class="note">Best net liquidation value since your last buy of each asset — after the 0.1% fee and gas. Swipe for more.</p>
<div id="missed" class="shelf"></div></section>
</main>
<nav><button data-page="trade" class="on">Trade</button><button data-page="assets">Assets</button><button data-page="history">History</button><button data-page="analytics">Analytics</button></nav>
<dialog id="picker"><input id="q" placeholder="Search coin (BTC, SOL…)"><ul id="list"></ul><button id="close">Close</button></dialog>
<div id="toast"></div>
<script src="app.js"></script></body></html>
